<extend template="base.shtml">
<head id="head">
</head>
<main id="main">
  <header class="page-head">
    <div class="container">
      <div class="page-head-grid">
        <div class="page-head-copy">
          <p class="kicker"><span class="kicker-dot"></span><span :text="$page.custom.get('eyebrow')"></span></p>
          <h1 class="display-1" :text="$page.title"></h1>
          <p class="page-lede" :text="$page.description"></p>
        </div>
        <div class="page-orbit" aria-hidden="true">
          <span class="page-orbit-ring page-orbit-ring-1"></span>
          <span class="page-orbit-ring page-orbit-ring-2"></span>
          <span class="page-orbit-ring page-orbit-ring-3"></span>
          <span class="page-orbit-core"></span>
          <span class="page-orbit-node page-orbit-node-1"></span>
          <span class="page-orbit-node page-orbit-node-2"></span>
        </div>
      </div>
    </div>
  </header>

  <section class="section page-section">
    <div class="container">
      <div class="highlights-grid">
        <ctx :loop="$page.custom.get('highlights')">
          <div class="highlight">
            <span class="meta-label" :text="$loop.it.get('label')"></span>
            <p :text="$loop.it.get('value')"></p>
          </div>
        </ctx>
      </div>

      <div class="page-body-grid">
        <div class="prose prose-page" :html="$page.content()"></div>
        <aside class="page-aside">
          <div class="aside-card">
            <span class="meta-label" :text="$i18n.get('page_contact')"></span>
            <a class="aside-mail" href="mailto:hello@chy3.xyz">hello@chy3.xyz</a>
            <a class="text-link" href="https://github.com/chy3xyz" rel="noopener noreferrer">
              <span>GitHub</span><span>↗</span>
            </a>
          </div>
        </aside>
      </div>
    </div>
  </section>

  <section class="page-next">
    <div class="container">
      <p class="meta-label" :text="$i18n.get('page_next')"></p>
      <div class="page-next-links">
        <ctx :if="$site.page('projects').isCurrent().not()">
          <a href="$site.page('projects').link()">
            <span :text="$i18n.get('nav_projects')"></span>
            <span>→</span>
          </a>
        </ctx>
        <ctx :if="$site.page('platform').isCurrent().not()">
          <a href="$site.page('platform').link()">
            <span :text="$i18n.get('nav_platform')"></span>
            <span>→</span>
          </a>
        </ctx>
        <ctx :if="$site.page('ecosystem').isCurrent().not()">
          <a href="$site.page('ecosystem').link()">
            <span :text="$i18n.get('nav_ecosystem')"></span>
            <span>→</span>
          </a>
        </ctx>
        <ctx :if="$site.page('about').isCurrent().not()">
          <a href="$site.page('about').link()">
            <span :text="$i18n.get('nav_about')"></span>
            <span>→</span>
          </a>
        </ctx>
      </div>
    </div>
  </section>
</main>
